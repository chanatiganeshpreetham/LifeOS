name: Deploy production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        required: true
        default: main
        type: string
      version:
        description: New Docker image version, for example v1.3.0
        required: true
        type: string

permissions: {}

concurrency:
  group: lifeos-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate deployment inputs
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
          DEPLOY_VERSION: ${{ inputs.version }}
        run: |
          [[ "$DEPLOY_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "Invalid branch name."
            exit 1
          }
          [[ "$DEPLOY_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$ ]] || {
            echo "Invalid version. Use up to 120 letters, digits, dots, underscores, or hyphens."
            exit 1
          }

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "VPS_SSH_PRIVATE_KEY secret is missing."; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "VPS_KNOWN_HOSTS secret is missing."; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Start the VPS deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          DEPLOY_BRANCH: ${{ inputs.branch }}
          DEPLOY_VERSION: ${{ inputs.version }}
        run: |
          test -n "$VPS_HOST" || { echo "VPS_HOST secret is missing."; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER secret is missing."; exit 1; }
          test -n "$VPS_APP_DIR" || { echo "VPS_APP_DIR repository variable is missing."; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "VPS_HOST must be an IP address or hostname."; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "VPS_USER is invalid."; exit 1; }
          [[ "$VPS_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$VPS_APP_DIR" != *"/../"* ]] || {
            echo "VPS_APP_DIR must be an absolute path without shell metacharacters."
            exit 1
          }
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo '$VPS_APP_DIR/deploy.sh' '$DEPLOY_BRANCH' '$DEPLOY_VERSION'"
