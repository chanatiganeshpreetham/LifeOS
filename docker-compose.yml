services:
  api:
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in project .env to Prisma Postgres}"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: noreply@lifeos.local
    ports:
      - "8000:8000"
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
